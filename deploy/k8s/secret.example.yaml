apiVersion: v1
kind: Secret
metadata:
  name: social-mcp-secrets
  namespace: social-mcp
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "YOUR_PRODUCTION_POSTGRES_PASSWORD"
  REDIS_PASSWORD: "YOUR_PRODUCTION_REDIS_PASSWORD"
  TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # 64-hex chars (32-bytes)
  QUEUE_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # 64-hex chars (32-bytes)
  JWT_SIGNING_SECRET: "YOUR_PRODUCTION_JWT_SIGNING_SECRET_MIN_32_CHARS"
  METRICS_BEARER_TOKEN: "YOUR_PROMETHEUS_METRICS_BEARER_TOKEN_SECRET"
  TWITTER_CLIENT_ID: "YOUR_TWITTER_CLIENT_ID"
  TWITTER_CLIENT_SECRET: "YOUR_TWITTER_CLIENT_SECRET"
  YOUTUBE_CLIENT_ID: "YOUR_YOUTUBE_CLIENT_ID"
  YOUTUBE_CLIENT_SECRET: "YOUR_YOUTUBE_CLIENT_SECRET"
  INSTAGRAM_CLIENT_ID: "YOUR_INSTAGRAM_CLIENT_ID"
  INSTAGRAM_CLIENT_SECRET: "YOUR_INSTAGRAM_CLIENT_SECRET"
  INSTAGRAM_WEBHOOK_SECRET: "YOUR_INSTAGRAM_WEBHOOK_SECRET"
