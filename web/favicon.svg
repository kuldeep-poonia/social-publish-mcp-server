<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#af52de"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg-grad)" stroke="#2c2c30" stroke-width="8"/>

  <!-- Glowing Neural Orbit -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neon-glow)" stroke-width="8" stroke-dasharray="16 12" filter="url(#glow)"/>
  
  <!-- Outer Matrix Nodes -->
  <g stroke="url(#neon-glow)" stroke-width="4" filter="url(#glow)">
    <line x1="256" y1="90" x2="380" y2="170" />
    <line x1="380" y1="170" x2="380" y2="342" />
    <line x1="380" y1="342" x2="256" y2="422" />
    <line x1="256" y1="422" x2="132" y2="342" />
    <line x1="132" y1="342" x2="132" y2="170" />
    <line x1="132" y1="170" x2="256" y2="90" />

    <line x1="256" y1="90" x2="256" y2="256" />
    <line x1="380" y1="170" x2="256" y2="256" />
    <line x1="380" y1="342" x2="256" y2="256" />
    <line x1="256" y1="422" x2="256" y2="256" />
    <line x1="132" y1="342" x2="256" y2="256" />
    <line x1="132" y1="170" x2="256" y2="256" />
  </g>

  <!-- Nodes Dots -->
  <circle cx="256" cy="90" r="14" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="380" cy="170" r="14" fill="#af52de" filter="url(#glow)"/>
  <circle cx="380" cy="342" r="14" fill="#ff9500" filter="url(#glow)"/>
  <circle cx="256" cy="422" r="14" fill="#ff2d55" filter="url(#glow)"/>
  <circle cx="132" cy="342" r="14" fill="#af52de" filter="url(#glow)"/>
  <circle cx="132" cy="170" r="14" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Core Hub Badge -->
  <circle cx="256" cy="256" r="64" fill="#18181b" stroke="url(#neon-glow)" stroke-width="6"/>
  <text x="256" y="270" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">MCP</text>
</svg>
